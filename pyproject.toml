[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperclip-agent"
version = "0.1.0"
description = "Local personal assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.7.0",
    "deepeval>=4.3.1",
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "kokoro>=0.9.4",
    "mcp[cli]>=2.2.0",
    "notion-client>=3.1.0",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "sounddevice>=0.5.6",
]

[project.scripts]
paperclip = "paperclip.__main__:main"

[tool.hatch.build.targets.sdist]
only-include = ["paperclip", "README.md", ".env.example"]

[tool.hatch.build.targets.wheel]
packages = ["paperclip"]

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "paperclip/env.example"

[tool.pytest.ini_options]
pythonpath = ["."]
